name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: painter-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Painter APK ready

          [Download the APK artifact]($ARTIFACT_URL), extract the ZIP, and install `app-debug.apk` on your Android phone.

          Requires Android 8.0 or newer and Android System WebView 94 or newer.

          This APK is debug-signed for testing. No repository secrets are needed. Each fresh runner may use a different debug signing key; if an update cannot install, uninstall the old test app first (this deletes its locally saved drawings). Export any drawings you want to keep before uninstalling. Use a stable release signing key for distributed updates.
          EOF
